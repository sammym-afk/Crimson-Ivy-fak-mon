<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Crimson Ivy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="title-screen" class="screen active">
      <div class="logo-wrap">
        <div class="series-name">POKÉMON</div>
        <h1>CRIMSON IVY</h1>
        <p class="subtitle">A browser adventure</p>
      </div>
      <div class="title-buttons">
        <button id="new-game-btn">New Game</button>
        <button id="continue-btn">Continue</button>
        <button id="erase-btn" class="danger">Erase Save</button>
      </div>
      <p id="save-status" class="small-note"></p>
    </section>

    <section id="setup-screen" class="screen">
      <div class="panel setup-panel">
        <h2>Begin Your Journey</h2>
        <label for="player-name">What is your name?</label>
        <input id="player-name" maxlength="12" placeholder="Trainer">
        <button id="confirm-name-btn">Continue</button>
      </div>
    </section>

    <section id="starter-screen" class="screen">
      <div class="panel">
        <h2>Choose Your First Partner</h2>
        <p>Professor Ivy has prepared three rare Pokémon.</p>
        <div id="starter-grid" class="starter-grid"></div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="game-header">
        <div>
          <strong id="area-name">Ivy Town</strong>
          <span id="objective-text">Meet Professor Ivy</span>
        </div>
        <button id="phone-btn">Phone</button>
      </header>

      <canvas id="game-canvas" width="640" height="480" aria-label="Crimson Ivy game world"></canvas>

      <div id="dialogue-box" class="dialogue hidden">
        <p id="dialogue-name"></p>
        <p id="dialogue-text"></p>
        <button id="dialogue-next">Next</button>
      </div>

      <div id="choice-box" class="dialogue hidden">
        <p id="choice-text"></p>
        <div id="choice-buttons"></div>
      </div>

      <div id="phone-menu" class="overlay hidden">
        <div class="panel phone-panel">
          <h2>Crimson Phone</h2>
          <div class="phone-grid">
            <button data-phone="party">Party</button>
            <button data-phone="bag">Bag</button>
            <button data-phone="pokedex">Pokédex</button>
            <button data-phone="quests">Quests</button>
            <button data-phone="save">Save</button>
            <button data-phone="title">Title Screen</button>
          </div>
          <button id="close-phone">Close</button>
        </div>
      </div>

      <div id="info-panel" class="overlay hidden">
        <div class="panel info-card">
          <h2 id="info-title"></h2>
          <div id="info-content"></div>
          <button id="close-info">Back</button>
        </div>
      </div>

      <div id="battle-screen" class="overlay hidden">
        <div class="battle-field">
          <div class="enemy-side">
            <div class="battle-card">
              <strong id="enemy-name"></strong>
              <span id="enemy-level"></span>
              <div class="hp-bar"><div id="enemy-hp-fill"></div></div>
            </div>
            <div id="enemy-sprite" class="battle-sprite enemy-sprite"></div>
          </div>

          <div class="player-side">
            <div id="player-sprite" class="battle-sprite player-sprite"></div>
            <div class="battle-card">
              <strong id="active-name"></strong>
              <span id="active-level"></span>
              <div class="hp-bar"><div id="active-hp-fill"></div></div>
              <small id="active-hp-text"></small>
            </div>
          </div>

          <div id="battle-message" class="battle-message"></div>

          <div id="battle-menu" class="battle-menu">
            <button data-battle="fight">Fight</button>
            <button data-battle="bag">Bag</button>
            <button data-battle="party">Party</button>
            <button data-battle="run">Run</button>
          </div>

          <div id="move-menu" class="battle-menu hidden"></div>
          <div id="battle-bag" class="battle-menu hidden"></div>
        </div>
      </div>

      <div id="touch-controls">
        <div class="dpad">
          <button data-dir="up">▲</button>
          <div>
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
          </div>
        </div>
        <div class="action-wrap">
          <button id="action-btn">A</button>
          <button id="menu-btn">MENU</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
