<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crimson Ivy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <header>
      <h1>Crimson Ivy</h1>
      <div id="status">Starter's Meadow</div>
    </header>

    <canvas id="game" width="640" height="480" aria-label="Crimson Ivy game area"></canvas>

    <section id="message-box" class="hidden" aria-live="polite">
      <p id="message-text"></p>
      <button id="message-next">Continue</button>
    </section>

    <section id="menu" class="panel hidden">
      <h2>Crimson Phone</h2>
      <div class="menu-grid">
        <button data-menu="pokedex">Pokédex</button>
        <button data-menu="party">Party</button>
        <button data-menu="bag">Bag</button>
        <button data-menu="map">Map</button>
        <button data-menu="quests">Quests</button>
        <button data-menu="save">Save</button>
      </div>
      <button id="close-menu">Close</button>
    </section>

    <section id="detail-panel" class="panel hidden">
      <h2 id="detail-title">Menu</h2>
      <div id="detail-content"></div>
      <button id="close-detail">Back</button>
    </section>

    <div id="touch-controls" aria-label="Touch controls">
      <div class="dpad">
        <button data-dir="up">▲</button>
        <div>
          <button data-dir="left">◀</button>
          <button data-dir="down">▼</button>
          <button data-dir="right">▶</button>
        </div>
      </div>
      <div class="action-buttons">
        <button id="action-button">A</button>
        <button id="menu-button">MENU</button>
      </div>
    </div>

    <p class="help">Move with arrow keys/WASD or the touch controls. Press Space/Enter or the on-screen A button to interact. Press M for the phone.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
